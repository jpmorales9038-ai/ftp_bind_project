name: Build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

jobs:
  build-app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Instalamos el Android SDK descargando el cmdline-tools oficial de
      # Google directamente, en vez de depender de rutas preinstaladas del
      # runner (que varían y no son confiables) o de la acción de terceros
      # que instalaba el paquete legacy "tools" ya retirado.
      - name: Descargar Android cmdline-tools
        run: |
          export ANDROID_SDK_ROOT="$HOME/android-sdk"
          mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools"
          curl -sSL -o cmdline-tools.zip \
            https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q cmdline-tools.zip -d "$ANDROID_SDK_ROOT/cmdline-tools"
          mv "$ANDROID_SDK_ROOT/cmdline-tools/cmdline-tools" "$ANDROID_SDK_ROOT/cmdline-tools/latest"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_SDK_ROOT/platform-tools" >> "$GITHUB_PATH"

      - name: Instalar paquetes del SDK y aceptar licencias
        run: |
          yes | sdkmanager --licenses > /dev/null
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      # No versionamos gradlew/gradle-wrapper.jar en el repo: los generamos
      # aquí con la Gradle que instaló setup-gradle, así el build es 100%
      # reproducible desde Actions sin depender de nada preinstalado.
      - name: Generar Gradle wrapper
        run: gradle wrapper --gradle-version 8.7

      - name: Build debug APK
        run: ./gradlew assembleDebug --console=plain

      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/*.apk

  package-module:
    needs: build-app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Descargar APK ya compilado
        uses: actions/download-artifact@v4
        with:
          name: app-debug-apk
          path: apk

      - name: Descargar binario de rclone (linux-arm64)
        run: |
          curl -L -o rclone.zip https://downloads.rclone.org/rclone-current-linux-arm64.zip
          unzip -q rclone.zip -d rclone_extracted
          cp rclone_extracted/*/rclone module/bin/rclone
          chmod +x module/bin/rclone

      # El APK va DENTRO del módulo (module/app.apk) para que customize.sh
      # lo instale/actualice solo al flashear el módulo desde el Manager.
      - name: Copiar APK dentro del módulo
        run: cp apk/*.apk module/app.apk

      - name: Empaquetar módulo KernelSU
        run: |
          cd module
          zip -r ../rclone-ftp-bind-module.zip . -x "bin/README.txt"

      - name: Subir módulo
        uses: actions/upload-artifact@v4
        with:
          name: rclone-ftp-bind-module
          path: rclone-ftp-bind-module.zip

  release:
    if: github.event_name == 'push'
    needs: [ build-app, package-module ]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist

      # Release fija con tag "latest": cada push exitoso a main la
      # sobrescribe (mismos assets, un solo release siempre vigente), sin
      # necesidad de crear tags manualmente.
      - name: Publicar/actualizar release "latest"
        uses: softprops/action-gh-release@v2
        env:
          # La acción lee el token de esta variable de entorno; sin ella
          # falla la autenticación contra la API y el release nunca se
          # crea/actualiza (con permissions.contents:write solo se le da
          # permiso de escritura al token por default, pero hay que
          # pasárselo explícitamente igual).
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: latest
          name: "Build automático"
          body: |
            Build generado automáticamente desde el commit ${{ github.sha }}.
          make_latest: true
          files: dist/rclone-ftp-bind-module/*.zip
